name: CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    name: Build, tests and quality
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration-password
          POSTGRES_DB: integration
        ports: ['5432:5432']
    env:
      TEST_DATABASE_URL: postgresql://integration:integration-password@localhost:5432/integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run quality
      - name: Native tests and original regression with coverage
        run: npm run test:cov
      - run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-billing
          path: coverage
  container:
    name: Container build
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
  deploy:
    name: Kubernetes rollout
    needs: container
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: fase4
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - run: kubectl apply -k k8s/base
      - run: kubectl -n oficina-billing set image deployment/oficina-billing-service api=${{ steps.image.outputs.name }}:${{ github.sha }}
      - run: kubectl -n oficina-billing rollout status deployment/oficina-billing-service --timeout=180s
      - name: Validate deployed readiness
        run: |
          kubectl -n oficina-billing port-forward service/oficina-billing-service 3000:3000 > /tmp/port-forward.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3000/ready; then exit 0; fi
            sleep 1
          done
          exit 1
  kubernetes-validation:
    name: Kubernetes deploy validation
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Create ephemeral Kubernetes environment
        run: |
          curl --fail --location https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 --output /tmp/kind
          chmod +x /tmp/kind
          /tmp/kind create cluster --name fase4 --wait 120s
      - name: Build and load tested image
        run: |
          docker build -t oficina-billing-service:${{ github.sha }} .
          /tmp/kind load docker-image oficina-billing-service:${{ github.sha }} --name fase4
      - name: Provision independent namespace and secrets
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl -n oficina-billing create secret generic service-secrets \
            --from-literal=DATABASE_URL='postgresql://billing:integration-password@database:5432/billing' \
            --from-literal=DATABASE_PASSWORD=integration-password \
            --from-literal=AMQP_URL=amqp://integration:integration-password@rabbitmq:5672 \
            --from-literal=JWT_SECRET=ci-integration-secret-thirty-two-characters
          kubectl -n oficina-billing apply -f k8s/test/broker.yaml
          kubectl -n oficina-billing rollout status deployment/test-rabbitmq --timeout=180s
      - name: Deploy independent service and database
        run: |
          kubectl apply -k k8s/base
          kubectl -n oficina-billing set image deployment/oficina-billing-service api=oficina-billing-service:${{ github.sha }}
          kubectl -n oficina-billing set env deployment/oficina-billing-service DD_TRACE_ENABLED=false
          kubectl -n oficina-billing rollout status statefulset/oficina-billing-service-database --timeout=180s
          kubectl -n oficina-billing rollout status deployment/oficina-billing-service --timeout=180s
      - name: Smoke-test deployed readiness and OpenAPI
        run: |
          kubectl -n oficina-billing port-forward service/oficina-billing-service 3000:3000 > /tmp/port-forward.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3000/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3000/ready
          curl --fail http://127.0.0.1:3000/openapi.json
      - name: Diagnose failed deployment
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n oficina-billing get events --sort-by=.lastTimestamp
          kubectl -n oficina-billing logs deployment/oficina-billing-service --all-containers=true --tail=100 || true
      - name: Remove temporary cluster
        if: always()
        run: /tmp/kind delete cluster --name fase4
